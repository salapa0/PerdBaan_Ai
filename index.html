<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>เปิดบ้าน : AI ช่วยโฮมสเตย์ชนบทขึ้น Agoda</title>
  <!-- Owner: A (frontend). Starter page: two panes, owner phone (LINE style) and staff console. -->
  <style>
    body { margin: 0; font-family: system-ui, sans-serif; background: #f3f4f6; }
    #app { display: flex; gap: 24px; justify-content: center; padding: 24px; }
    #phone { width: 375px; height: 700px; background: #fff; border: 1px solid #d1d5db; border-radius: 24px; overflow: hidden; }
    #console { flex: 1; max-width: 560px; background: #fff; border: 1px solid #d1d5db; border-radius: 12px; padding: 16px; }
    h2 { margin-top: 0; font-size: 16px; }
  </style>
</head>
<body>
  <div id="app">
    <section id="phone" aria-label="Owner phone (LINE style)"></section>
    <section id="console" aria-label="Staff console"><h2>Staff console</h2></section>
  </div>
  <script type="module" src="src/app.js"></script>
</body>
</html>
